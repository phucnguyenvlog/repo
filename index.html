<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phúc Nguyên Repo</title>
    <!-- Logo trên tab trình duyệt -->
    <link rel="icon" type="image/png" href="CydiaIcon.png">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
        }
        .repo-icon {
            width: 110px;
            height: 110px;
            border-radius: 26px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin-bottom: 20px;
            object-fit: cover;
        }
        h1 {
            font-size: 30px;
            margin: 10px 0;
            font-weight: 700;
        }
        p.subtitle {
            color: #9ca3af;
            font-size: 15px;
            margin: 5px 0 25px 0;
            line-height: 1.5;
        }
        .url-box {
            background-color: #161e2e;
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 14px 20px;
            font-family: monospace;
            color: #60a5fa;
            margin-bottom: 25px;
            word-break: break-all;
            font-size: 14px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: #161e2e;
            color: #e5e7eb;
            border: 1px solid #1f2937;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background-color: #1f2937;
        }
        .btn-cert {
            background-color: #059669;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }
        .btn-cert:hover {
            background-color: #047857;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="CydiaIcon.png" alt="Repo Icon" class="repo-icon">
        
        <h1>Phúc Nguyễn Repo</h1>
        <p class="subtitle">Kho lưu trữ tweak, ứng dụng và tiện ích dành cho thiết bị iOS cổ</p>
        
        <div class="url-box">https://phucnguyenvlog.pages.dev/</div>
        
        <div class="btn-group">
            <a href="cydia://url/addsource=https://phucnguyenvlog.pages.dev/" class="btn">Thêm vào Cydia</a>
            <a href="sileo://source/https://phucnguyenvlog.pages.dev/" class="btn btn-secondary">Thêm vào Sileo</a>
            <a href="zbra://sources/add/https://phucnguyenvlog.pages.dev/" class="btn btn-secondary">Thêm vào Zebra</a>
            <a href="Certificates for Legacy iOS.mobileconfig" class="btn btn-cert" download>Tải Chứng Chỉ iOS Cổ (.mobileconfig)</a>
        </div>
    </div>
</body>
</html>
