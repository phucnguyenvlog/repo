        var iosVersion = keys[i];
        var osData = repoData[iosVersion];
        
        if (osData.apps.length > 0) {
            htmlContent += '<div class="group">' +
                           '<div class="accordion-header" onclick="toggleAccordion(this)">' +
                           '<img src="' + osData.osIcon + '" class="os-logo" alt="iOS ' + iosVersion + '">' +

                           '</div>' +
                           '<div class="accordion-content" style="display: none;">';

            for (var j = 0; j < osData.apps.length; j++) {
                var app = osData.apps[j];

                var safePlistUrl = encodeURI(app.plistUrl);
                var installLink = 'itms-services://?action=download-manifest&url=' + safePlistUrl;
                
                // Đã gỡ hoàn toàn lệnh onerror fallback logo phucnguyen, trả lại thẻ img nguyên bản và tinh gọn nhất

                               '<div class="app-icon-cell">' +
                               '<img src="' + app.icon + '" class="app-icon">' +
                               '</div>' +
                               '<div class="app-info-cell">' +
                               '<div class="app-title">' + app.name + '</div>' +
                               '<div class="app-version">Phiên bản ' + app.version + '</div>' +
                               '<div class="app-rating">' + app.stars + ' <span class="vip-tag">VIP</span></div>' +
                               '</div>' +
                               '<div class="btn-install-cell">Cài đặt</div>' +
                               '</a>';
            }

            htmlContent += '</div></div>';
        }
